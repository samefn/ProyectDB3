<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Soccer Dashboard</title>
  <link rel="stylesheet" href="Styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .auth-container {
      width: 100%;
      height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-form {
      width: 300px;
    }

    .form-result {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      font-weight: bold;
    }

    #loginResult.success {
      color: #00ff88;
    }

    #loginResult.error {
      color: #ff4d4d;
    }

    .register-link {
      font-size: 12px;
      color: #a8b3c0;
      margin-top: 20px;
      text-align: center;
    }

    .register-link a {
      color: #00ff88;
      text-decoration: none;
      font-weight: bold;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="background-overlay"></div>

  <header>
    <nav class="navbar">
      <div class="logo">
        <i class="fa-solid fa-globe"></i>
        Soccer Dashboard
      </div>
    </nav>
  </header>

  <section class="auth-container">

    <div class="container">

      <div class="form-section auth-form">

        <h2 style="text-align: center; margin-bottom: 15px;">Iniciar Sesión</h2>

        <form id="loginForm">
          <label for="name">Usuario</label>
          <input type="text" id="name" name="name" placeholder="Ingresa tu usuario" required>

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>

          <button type="submit">Ingresar</button>
        </form>

        <div id="loginResult" class="form-result"></div>

        <p class="register-link">
          ¿No tienes una cuenta? <a href="index.html">Regístrate aquí</a>
        </p>

      </div>
    </div>
  </section>

  <script src="js/Login.js"></script>

  <script>
    const resultDiv = document.getElementById('loginResult');

    const observer = new MutationObserver(mutations => {
      mutations.forEach(mutation => {
        if (resultDiv.innerText.includes('exitoso')) {
          resultDiv.classList.add('success');
          resultDiv.classList.remove('error');
          setTimeout(() => { window.location.href = 'indexsql.html'; }, 1500);

        } else if (resultDiv.innerText.includes('Error') || resultDiv.innerText.includes('incorrectos')) {
          resultDiv.classList.add('error');
          resultDiv.classList.remove('success');
        }
      });
    });

    observer.observe(resultDiv, { childList: true, characterData: true, subtree: true });
  </script>

</body>

</html>
